#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
    with:
      duckdb_version: 57eff1742dfb706c19d9a8a7c45e46b7cb7cc34f # v2.0-cyanoptera 2026-10-13 pin
      ci_tools_version: 969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
      extension_name: duckir
      # vcpkg 2026.06.24 (what extension-ci-tools main uses), for Eigen 5.0.1: the v1.5.6 default (84bab45) has 3.4.1.
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
      # mingw: Rtools' CMake (3.24.1) is older than the 3.26 that DuckIR, PDX and SuperKMeans require.
      # wasm_threads: threaded Wasm extensions are broken upstream (extension-ci-tools #391).
      exclude_archs: "windows_amd64_mingw;wasm_threads"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
    with:
      duckdb_version: 57eff1742dfb706c19d9a8a7c45e46b7cb7cc34f # v2.0-cyanoptera 2026-10-13 pin
      ci_tools_version: 969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
      extension_name: duckir
      format_checks: 'format;tidy'
