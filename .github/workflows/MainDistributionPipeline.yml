#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: pdxearch
      extra_toolchains: "fortran;omp"
      # vcpkg 2026.06.24 (what extension-ci-tools main uses). The v1.5.6 default (84bab45) links the static
      # openblas[threads,dynamic-arch] without -lpthread -lm when lapack-reference looks for BLAS, and fails on Linux.
      # Drop this once the extension-ci-tools version we pin defaults to a newer vcpkg.
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
      # Temporarily disabled to focus efforts on macOS and linux stability.
      exclude_archs: "windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: pdxearch
      format_checks: 'format'
